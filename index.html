<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="生年月日から四柱推命の日干と五行タイプを調べる簡易診断です。">
  <meta name="robots" content="index, follow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>日干・五行簡易診断</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <section class="card intro-card" aria-labelledby="page-title">
      <p class="eyebrow">四柱推命</p>
      <h1 id="page-title">日干・五行簡易診断</h1>
      <p class="lead">生年月日を選ぶと、あなたの中心的な性質を表す日干を確認できます。</p>

      <form id="birthdate-form" novalidate>
        <fieldset>
          <legend>生年月日を選ぶ</legend>
          <div class="date-fields">
            <div class="field">
              <label for="birth-year">年</label>
              <select id="birth-year" name="birth-year" required>
                <option value="">年</option>
              </select>
            </div>
            <div class="field">
              <label for="birth-month">月</label>
              <select id="birth-month" name="birth-month" required>
                <option value="">月</option>
              </select>
            </div>
            <div class="field">
              <label for="birth-day">日</label>
              <select id="birth-day" name="birth-day" required>
                <option value="">日</option>
              </select>
            </div>
          </div>
        </fieldset>

        <p id="error-message" class="error-message" aria-live="polite"></p>
        <button id="diagnose-button" class="primary-button" type="submit" disabled>日干と五行を診断する</button>
      </form>
    </section>

    <section id="result" class="card result-card" aria-labelledby="result-title" aria-live="polite" hidden>
      <p class="eyebrow">診断結果</p>
      <h2 id="result-title">あなたの日干</h2>
      <p id="result-date" class="result-date"></p>
      <div id="stem-symbol" class="stem-symbol" aria-label=""></div>
      <p id="stem-reading" class="stem-reading"></p>

      <section class="element-result" aria-labelledby="element-title">
        <p class="element-kicker">日干から分かる五行</p>
        <h3 id="element-title">あなたの五行</h3>
        <div id="element-symbol" class="element-symbol" aria-label=""></div>
        <p id="element-reading" class="element-reading"></p>
        <p id="element-type" class="element-type"></p>
        <p id="element-relation" class="element-relation"></p>
        <p id="type-description" class="type-description"></p>
      </section>

      <button id="reset-button" class="secondary-button" type="button">もう一度調べる</button>
      <p class="privacy-note">入力した生年月日は、この端末のブラウザ内だけで計算されます。外部への送信や保存は行いません。</p>
      <p class="notice">この診断は、生年月日の暦日をもとに日干を表示する簡易版です。出生時刻や出生地、日付の区切り方を含む詳しい命式は、流派によって判定が異なる場合があります。重要な判断は占いだけで決めず、ひとつの参考として楽しんでください。</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
